<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6a65"/>
    </marker>
    <clipPath id="bubble"><circle cx="165" cy="150" r="98"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1200" height="850" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="34" font-size="22" font-weight="700" fill="#1d2a27">MacroRail 3D scanning module, v1</text>
  <text x="40" y="56" font-size="13.5" fill="#5b6a65">Side view, roughly to scale (1 mm ≈ 2.6 px). Bolts to the sample platform. Motorised yaw; centring and tilt set by hand.</text>

  <g transform="translate(0 20)">
  <!-- ===== side view ===== -->
  <!-- base and rail -->
  <rect x="30" y="470" width="840" height="12" fill="#e7ecea" stroke="#c9d4d0"/>
  <line x1="40" y1="392" x2="627" y2="392" stroke="#9aa4a6" stroke-width="8" stroke-linecap="round"/>
  <line x1="40" y1="413" x2="627" y2="413" stroke="#c9a24a" stroke-width="6"/>
  <path d="M34 380 l10 -8 m-10 26 l10 -8 m-10 26 l10 -8" stroke="#5b6a65" stroke-width="1.5" fill="none"/>
  <rect x="588" y="340" width="78" height="130" rx="3" fill="#cfdde1" stroke="#7d9aa3"/>
  <text x="627" y="458" font-size="11" fill="#5b6a65" text-anchor="middle">far end block</text>
  <!-- carriage -->
  <rect x="250" y="363" width="78" height="38" rx="2" fill="#3a4145"/>
  <rect x="432" y="363" width="78" height="38" rx="2" fill="#3a4145"/>
  <rect x="237" y="348" width="286" height="15" fill="#7fa9b6" stroke="#4f7f8d"/>
  <rect x="276" y="335" width="208" height="13" fill="#e7ecea" stroke="#9aa4a6"/>
  <rect x="294" y="335" width="8" height="13" fill="#3a4145"/><rect x="458" y="335" width="8" height="13" fill="#3a4145"/>

  <!-- module base plate -->
  <rect x="281" y="319" width="198" height="16" rx="2" fill="#b9d3da" stroke="#4f7f8d"/>
  <!-- upright (far side) with index sector -->
  <path d="M362 319 L362 150 L398 150 L398 319 Z" fill="#dfe8e6" stroke="#9fb4b9"/>
  <path d="M 312.0 99.1 A 82 82 0 0 1 462 145 L 442 145 A 62 62 0 0 0 328.5 110.2 Z" fill="#dfe8e6" stroke="#9fb4b9"/>
  <!-- index holes: -30, 0, 30, 60, 90 at r=72 -->
  <g fill="#ffffff" stroke="#4f7f8d" stroke-width="1.5">
    <circle cx="344" cy="82.6" r="5"/>
    <circle cx="380" cy="73" r="5" fill="#0d6a86"/>
    <circle cx="416" cy="82.6" r="5"/>
    <circle cx="442.4" cy="109" r="5"/>
    <circle cx="452" cy="145" r="5"/>
  </g>
  <g font-size="11" fill="#1d2a27" text-anchor="middle" font-weight="600">
    <text x="331" y="72">−30°</text><text x="380" y="62">0°</text><text x="428" y="72">30°</text><text x="462" y="101">60°</text><text x="474" y="149">90°</text>
  </g>
  <!-- cradle arm (behind), shown at tilt 0 with the index pin in the 0° hole -->
  <rect x="368" y="62" width="24" height="239" rx="3" fill="#b9d3da" stroke="#4f7f8d" opacity="0.85"/>
  <circle cx="380" cy="73" r="8" fill="none" stroke="#0d6a86" stroke-width="2.5"/>
  <!-- cradle bottom -->
  <rect x="323" y="285" width="114" height="16" rx="2" fill="#7fa9b6" stroke="#4f7f8d"/>
  <!-- yaw motor -->
  <rect x="325" y="233" width="110" height="52" rx="3" fill="#3a4145"/>
  <text x="380" y="264" font-size="11" fill="#ffffff" text-anchor="middle">yaw motor</text>
  <rect x="437" y="270" width="10" height="12" fill="#c7781a"/>
  <!-- centring slides -->
  <rect x="341" y="220" width="78" height="13" fill="#e7ecea" stroke="#5b6a65"/>
  <rect x="352" y="207" width="68" height="13" fill="#f4f7f6" stroke="#5b6a65"/>
  <line x1="341" y1="226.5" x2="306" y2="226.5" stroke="#5b6a65" stroke-width="3"/>
  <circle cx="294" cy="226.5" r="13" fill="#7fa9b6" stroke="#4f7f8d" stroke-width="2"/>
  <text x="294" y="231" font-size="11" fill="#1d2a27" text-anchor="middle" font-weight="700">X</text>
  <circle cx="434" cy="213.5" r="12" fill="#7fa9b6" stroke="#4f7f8d" stroke-width="2"/>
  <circle cx="434" cy="213.5" r="3" fill="#4f7f8d"/>
  <text x="434" y="196" font-size="11" fill="#1d2a27" text-anchor="middle" font-weight="700">Y</text>
  <!-- kinematic base, puck, collet, pin -->
  <rect x="352" y="199" width="54" height="8" fill="#9aa4a6"/>
  <circle cx="361" cy="198" r="3" fill="#5b6a65"/><circle cx="379" cy="198" r="3" fill="#5b6a65"/><circle cx="397" cy="198" r="3" fill="#5b6a65"/>
  <rect x="355" y="185" width="48" height="13" rx="2" fill="#f4f7f6" stroke="#5b6a65"/>
  <rect x="368.5" y="165" width="11" height="20" fill="#c9a24a" stroke="#9a7a2e"/>
  <line x1="374" y1="165" x2="374" y2="147" stroke="#5b6a65" stroke-width="1.6"/>
  <!-- insect (tiny at this scale) -->
  <ellipse cx="380" cy="145" rx="7" ry="3" fill="#c7781a"/>
  <!-- axes -->
  <line x1="380" y1="96" x2="380" y2="312" stroke="#0d6a86" stroke-width="1.3" stroke-dasharray="6 4"/>
  <circle cx="380" cy="145" r="10" fill="none" stroke="#0d6a86" stroke-width="1.5"/>
  <!-- cable loop -->
  <path d="M435 250 C 470 250, 478 290, 466 318" fill="none" stroke="#5b6a65" stroke-width="2"/>

  <!-- camera -->
  <rect x="497" y="64" width="14" height="162" rx="4" fill="#f2efe4" stroke="#c9b98a"/>
  <rect x="511" y="77" width="215" height="136" rx="6" fill="#3a4145"/>
  <rect x="505" y="117" width="8" height="56" fill="#1b2a33"/>
  <rect x="726" y="44" width="125" height="186" rx="8" fill="#2a2f33"/>
  <text x="788" y="141" font-size="12" fill="#ffffff" text-anchor="middle">A6400</text>
  <line x1="505" y1="145" x2="392" y2="145" stroke="#0d6a86" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- magnified bubble -->
  <line x1="371" y1="140" x2="256" y2="128" stroke="#5b6a65" stroke-width="1"/>
  <circle cx="165" cy="150" r="98" fill="#f6f9f8" stroke="#5b6a65" stroke-width="1.5"/>
  <g clip-path="url(#bubble)">
    <line x1="165" y1="40" x2="165" y2="260" stroke="#0d6a86" stroke-width="1.5" stroke-dasharray="7 5"/>
    <line x1="55" y1="150" x2="275" y2="150" stroke="#0d6a86" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="132" y1="262" x2="132" y2="166" stroke="#5b6a65" stroke-width="5" stroke-linecap="round"/>
    <circle cx="132" cy="164" r="6" fill="#efe3c9" stroke="#c9a24a"/>
    <ellipse cx="160" cy="148" rx="42" ry="17" fill="#c7781a"/>
    <ellipse cx="206" cy="146" rx="15" ry="12" fill="#c7781a"/>
    <path d="M140 160 l-14 22 M160 163 l-4 26 M180 160 l12 22 M140 136 l-14 -22 M160 133 l-4 -24 M180 136 l12 -22" stroke="#c7781a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="165" cy="150" r="5" fill="#ffffff" stroke="#0d6a86" stroke-width="2"/>
  </g>
  <text x="165" y="272" font-size="12" fill="#1d2a27" text-anchor="middle" font-weight="600">insect centre on both axes;</text>
  <text x="165" y="288" font-size="12" fill="#1d2a27" text-anchor="middle" font-weight="600">pin and glue sit off-axis</text>
  <text x="80" y="76" font-size="11" fill="#0d6a86">yaw axis</text>
  <text x="200" y="166" font-size="11" fill="#0d6a86">tilt axis</text>

  <!-- callout numbers -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <g><circle cx="180" cy="400" r="11" fill="#0d6a86"/><text x="180" y="404">1</text></g>
    <g><circle cx="260" cy="330" r="11" fill="#0d6a86"/><text x="260" y="334">2</text></g>
    <line x1="508" y1="310" x2="396" y2="310" stroke="#5b6a65" stroke-width="1"/><g><circle cx="520" cy="310" r="11" fill="#0d6a86"/><text x="520" y="314">3</text></g>
    <g><circle cx="470" cy="62" r="11" fill="#0d6a86"/><text x="470" y="66">4</text></g>
    <g><circle cx="305" cy="293" r="11" fill="#0d6a86"/><text x="305" y="297">5</text></g>
    <g><circle cx="455" cy="232" r="11" fill="#0d6a86"/><text x="455" y="236">6</text></g>
    <g><circle cx="294" cy="196" r="11" fill="#0d6a86"/><text x="294" y="200">7</text></g>
    <g><circle cx="330" cy="185" r="11" fill="#0d6a86"/><text x="330" y="189">8</text></g>
    <g><circle cx="270" cy="102" r="11" fill="#0d6a86"/><text x="270" y="106">9</text></g>
    <g><circle cx="870" cy="70" r="11" fill="#0d6a86"/><text x="870" y="74">10</text></g>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="12.5" fill="#1d2a27">
    <text x="895" y="96" font-size="13" font-weight="700" fill="#5b6a65" letter-spacing="1">PARTS</text>
    <text x="895" y="122"><tspan font-weight="700">1 Focus rail</tspan>, unchanged.</text>
    <text x="895" y="140" fill="#5b6a65">Depth per pose = its focus scan.</text>
    <text x="895" y="164"><tspan font-weight="700">2 Platform</tspan>: 4 × M4, 60 × 20 mm.</text>
    <text x="895" y="188"><tspan font-weight="700">3 Uprights</tspan>, tilt axis ~125 mm up.</text>
    <text x="895" y="212"><tspan font-weight="700">4 Tilt by hand</tspan>: index pin in</text>
    <text x="895" y="230" fill="#5b6a65">holes at −30, 0, 30, 60, 90°.</text>
    <text x="895" y="254"><tspan font-weight="700">5 Cradle</tspan> swings about the tilt axis.</text>
    <text x="895" y="278"><tspan font-weight="700">6 Yaw motor</tspan>: NEMA 17 + TMC2209,</text>
    <text x="895" y="296" fill="#5b6a65">hall home, ±185° cable loop.</text>
    <text x="895" y="320"><tspan font-weight="700">7 Centring slides</tspan> X and Y,</text>
    <text x="895" y="338" fill="#5b6a65">captive M3 thumbscrews, ±3 mm.</text>
    <text x="895" y="362"><tspan font-weight="700">8 Puck</tspan> on a 3-ball magnetic base;</text>
    <text x="895" y="380" fill="#5b6a65">pin collet, height from a gauge.</text>
    <text x="895" y="404"><tspan font-weight="700">9 Insect</tspan> where the axes cross.</text>
    <text x="895" y="428"><tspan font-weight="700">10 Camera</tspan> fixed, lens axis along</text>
    <text x="895" y="446" fill="#5b6a65">the rail; light fixed to the lens.</text>
    <text x="895" y="476" font-size="12" fill="#c7781a" font-weight="700">■ <tspan fill="#5b6a65" font-weight="400">hall sensor on the cradle</tspan></text>
  </g>

  <!-- ===== workflow ===== -->
  <text x="40" y="530" font-size="13" font-weight="700" fill="#5b6a65" letter-spacing="1">ONE SCAN</text>
  <g font-size="12.5">
    <!-- box template: x, width 168 -->
    <g>
      <rect x="40" y="545" width="168" height="118" rx="6" fill="#fbf4ea" stroke="#c7781a"/>
      <text x="54" y="568" font-weight="700" fill="#1d2a27">1 Mount</text>
      <text x="54" y="590" fill="#1d2a27">Click the puck on.</text>
      <text x="54" y="607" fill="#1d2a27">Set pin height with</text>
      <text x="54" y="624" fill="#1d2a27">the gauge.</text>
      <text x="54" y="651" fill="#c7781a" font-weight="700" font-size="11">YOU · 30 s</text>
    </g>
    <g>
      <rect x="226" y="545" width="168" height="118" rx="6" fill="#fbf4ea" stroke="#c7781a"/>
      <text x="240" y="568" font-weight="700" fill="#1d2a27">2 Centre</text>
      <text x="240" y="590" fill="#1d2a27">App turns 4 angles,</text>
      <text x="240" y="607" fill="#1d2a27">says "X ½ turn in".</text>
      <text x="240" y="624" fill="#1d2a27">Repeat to &lt; 0.1 mm.</text>
      <text x="240" y="651" fill="#c7781a" font-weight="700" font-size="11">YOU + APP · ~2 min</text>
    </g>
    <g>
      <rect x="412" y="545" width="168" height="118" rx="6" fill="#e9f3f6" stroke="#0d6a86"/>
      <text x="426" y="568" font-weight="700" fill="#1d2a27">3 Scan a ring</text>
      <text x="426" y="590" fill="#1d2a27">Yaw in 10° steps;</text>
      <text x="426" y="607" fill="#1d2a27">focus scan + stack</text>
      <text x="426" y="624" fill="#1d2a27">at every pose.</text>
      <text x="426" y="651" fill="#0d6a86" font-weight="700" font-size="11">AUTOMATIC</text>
    </g>
    <g>
      <rect x="598" y="545" width="168" height="118" rx="6" fill="#fbf4ea" stroke="#c7781a"/>
      <text x="612" y="568" font-weight="700" fill="#1d2a27">4 Next tilt</text>
      <text x="612" y="590" fill="#1d2a27">Move the index pin.</text>
      <text x="612" y="607" fill="#1d2a27">App re-checks centre;</text>
      <text x="612" y="624" fill="#1d2a27">adjust only if needed.</text>
      <text x="612" y="651" fill="#c7781a" font-weight="700" font-size="11">YOU · 30 s</text>
    </g>
    <g>
      <rect x="784" y="545" width="168" height="118" rx="6" fill="#e9f3f6" stroke="#0d6a86"/>
      <text x="798" y="568" font-weight="700" fill="#1d2a27">5 Repeat</text>
      <text x="798" y="590" fill="#1d2a27">3–4 rings, e.g.</text>
      <text x="798" y="607" fill="#1d2a27">−30°, 0°, 30°, 60°,</text>
      <text x="798" y="624" fill="#1d2a27">plus one top view.</text>
      <text x="798" y="651" fill="#0d6a86" font-weight="700" font-size="11">AUTOMATIC</text>
    </g>
    <g>
      <rect x="970" y="545" width="190" height="118" rx="6" fill="#e9f3f6" stroke="#0d6a86"/>
      <text x="984" y="568" font-weight="700" fill="#1d2a27">6 Export</text>
      <text x="984" y="590" fill="#1d2a27">One stacked image</text>
      <text x="984" y="607" fill="#1d2a27">per pose, laid out for</text>
      <text x="984" y="624" fill="#1d2a27">COLMAP or Meshroom.</text>
      <text x="984" y="651" fill="#0d6a86" font-weight="700" font-size="11">AUTOMATIC</text>
    </g>
  </g>
  <g stroke="#5b6a65" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="209" y1="604" x2="224" y2="604"/><line x1="395" y1="604" x2="410" y2="604"/>
    <line x1="581" y1="604" x2="596" y2="604"/><line x1="767" y1="604" x2="782" y2="604"/><line x1="953" y1="604" x2="968" y2="604"/>
  </g>
  <path d="M868 664 C 868 690, 682 690, 682 666" fill="none" stroke="#5b6a65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="775" y="702" font-size="11.5" fill="#5b6a65" text-anchor="middle">per tilt</text>

  <!-- ===== versions ===== -->
  <rect x="40" y="722" width="550" height="92" rx="6" fill="#f6f9f8" stroke="#c9d4d0"/>
  <text x="56" y="746" font-size="13.5" font-weight="700" fill="#1d2a27">v1, build now</text>
  <text x="56" y="768" font-size="12.5" fill="#1d2a27">Motors: rail (existing) + yaw. Yaw driver on the same UART bus (address 1).</text>
  <text x="56" y="786" font-size="12.5" fill="#1d2a27">By hand: X/Y centring screws, tilt index pin. Fits the current Nano.</text>
  <text x="56" y="804" font-size="12.5" fill="#5b6a65">Nano pins: yaw STEP D6, DIR D10, EN D11, home A0.</text>
  <rect x="610" y="722" width="550" height="92" rx="6" fill="#f6f9f8" stroke="#c9d4d0" stroke-dasharray="5 4"/>
  <text x="626" y="746" font-size="13.5" font-weight="700" fill="#1d2a27">v2, later</text>
  <text x="626" y="768" font-size="12.5" fill="#1d2a27">2 × 28BYJ-48 + ULN2003 turn the same captive screws; tilt gets a motor.</text>
  <text x="626" y="786" font-size="12.5" fill="#1d2a27">The wizard then centres with no hands. Needs ~11 more pins:</text>
  <text x="626" y="804" font-size="12.5" fill="#5b6a65">move to an Arduino Mega 2560 (same firmware toolchain, hardware UARTs).</text>
  </g>
</svg>
