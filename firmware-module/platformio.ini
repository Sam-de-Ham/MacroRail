; MacroRail scan module controller: Arduino Nano (ATmega328P) + two 28BYJ-48 on ULN2003 boards.
; Build:  pio run -d firmware-module
; Flash:  pio run -d firmware-module -e nano -t upload
;
; `nano` is for clones with the old bootloader (most CH340 Nanos);
; `nano_new` is for genuine/new-bootloader Nanos.

[env:nano]
platform = atmelavr@5.1.0
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
; A whole STATUS reply fits the TX buffer, so replying never blocks the step loop.
build_flags = -DSERIAL_TX_BUFFER_SIZE=128
lib_deps =
    waspinator/AccelStepper@1.64

[env:nano_new]
extends = env:nano
board = nanoatmega328new
