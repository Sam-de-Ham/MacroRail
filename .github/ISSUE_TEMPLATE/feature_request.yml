name: Feature request
description: An idea for the app, the firmware or the hardware.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: hardware
    attributes:
      label: Hardware involved
      description: Camera, lens, rail, scan module, or none.
