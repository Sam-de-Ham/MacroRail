# Install once with `uvx pre-commit install`; run on everything with `uvx pre-commit run -a`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.(stl|pdf|png|jpg|svg)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(stl|pdf|png|jpg|svg)$
      - id: check-yaml
      - id: check-toml

  # Keep rev in step with the ruff version in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        files: ^(src|tests|scripts)/
        pass_filenames: false  # checks the whole project, as configured in pyproject.toml
