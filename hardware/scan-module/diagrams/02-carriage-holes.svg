<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .part{fill:#eef2f1;stroke:#54635e;stroke-width:1.2}
    .used{fill:#9aaaa4}
    .free{fill:#ffffff;stroke:#b3261e;stroke-width:2}
    .slot{fill:#ffffff;stroke:#54635e}
    .dl{stroke:#54635e;stroke-width:1;fill:none}
    .ex{stroke:#9aaaa4;stroke-width:.8;stroke-dasharray:3 3;fill:none}
    .lab{fill:#b3261e;font-size:13px;font-weight:600}
    .cap{fill:#54635e;font-size:12px}
    .ttl{fill:#15201d;font-size:15px;font-weight:700}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#54635e"/></marker></defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text class="ttl" x="20" y="26">02 · Carriage top (03_carriage.stl, 110 × 134 mm), seen from above, 2 px/mm</text>
  <rect class="part" x="140" y="52" width="220" height="268"/>
  <g class="used">
    <circle cx="152" cy="280" r="4"/><circle cx="188" cy="280" r="4"/><circle cx="312" cy="280" r="4"/><circle cx="348" cy="280" r="4"/>
    <circle cx="152" cy="232" r="4"/><circle cx="188" cy="232" r="4"/><circle cx="312" cy="232" r="4"/><circle cx="348" cy="232" r="4"/>
    <circle cx="152" cy="120" r="4"/><circle cx="188" cy="120" r="4"/><circle cx="312" cy="120" r="4"/><circle cx="348" cy="120" r="4"/>
    <circle cx="152" cy="72" r="4"/><circle cx="188" cy="72" r="4"/><circle cx="312" cy="72" r="4"/><circle cx="348" cy="72" r="4"/>
    <circle cx="182" cy="304" r="3"/><circle cx="198" cy="304" r="3"/>
  </g>
  <g class="slot"><rect x="226" y="196" width="8" height="17" rx="4"/><rect x="266" y="196" width="8" height="17" rx="4"/><rect x="226" y="140" width="8" height="17" rx="4"/><rect x="266" y="140" width="8" height="17" rx="4"/></g>
  <g class="free"><circle cx="190" cy="196" r="5"/><circle cx="310" cy="196" r="5"/><circle cx="190" cy="156" r="5"/><circle cx="310" cy="156" r="5"/></g>
  <line class="ex" x1="190" y1="150" x2="190" y2="130"/><line class="ex" x1="310" y1="150" x2="310" y2="130"/>
  <line class="dl" x1="192" y1="134" x2="308" y2="134" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="lab" x="214" y="128">C1 = 60 (59.5)</text>
  <line class="ex" x1="316" y1="156" x2="400" y2="156"/><line class="ex" x1="316" y1="196" x2="400" y2="196"/>
  <line class="dl" x1="392" y1="158" x2="392" y2="194" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="lab" x="400" y="176">C2 = 20 (20.5)</text>
  <text class="cap" x="420" y="70">red: free holes, Ø4.5, for the module</text>
  <text class="cap" x="420" y="88">grey: bearing-block screws, heads C3 = 1.3 tall</text>
  <text class="cap" x="420" y="106">slots: nut carrier screws</text>
  <text class="cap" x="420" y="124">small pair: endstop trigger (M3)</text>
  <text class="cap" x="420" y="230">A base kept within ±24 mm across the rail</text>
  <text class="cap" x="420" y="248">clears every screw head; wider needs pockets.</text>
  <text class="cap" x="420" y="284">towards the far end, away from the camera</text>
  <line x1="420" y1="296" x2="560" y2="296" class="dl" marker-end="url(#ar)"/>
</svg>
