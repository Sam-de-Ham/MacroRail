# MacroRail installation config. Copy to ~/.config/macrorail/config.toml (install.sh does this).
# Everything here is optional: missing values use the defaults shown.
# Day-to-day settings (speeds, currents, step size, ...) are changed in the web UI instead.

[rail]
# The Nano's serial port. "auto" finds it by what it reports, which also works with the scan
# module's Nano plugged in (both are CH340 clones, so their /dev/serial/by-id names collide).
# Or pin it to a USB socket: `ls /dev/serial/by-path/`
port = "auto"
# Microsteps per mm of travel: 200 steps × 16 microsteps ÷ 8 mm lead (Tr8×8 screw).
steps_per_mm = 400
# Soft limits, in mm from the home switch. The rail parks at min_mm after homing.
min_mm = 0.5
travel_mm = 140.0
# Homing: seek the switch, back off until it releases plus a clearance, then touch it again
# slowly. The touch point becomes 0.
homing_speed_mm_s = 1.0
homing_probe_speed_mm_s = 0.2
homing_clearance_mm = 0.5
homing_release_max_mm = 5.0
homing_accel_mm_s2 = 10.0

[module]
# The 3D scan module's own Nano (docs/protocol-module.md). "auto" as for the rail.
port = "auto"
# Safe tilt range from the CAD lens-clearance sweep, in degrees (0 = level, + = back towards
# the camera). Until the tilt switch's angle is calibrated, tilt stops at the uncalibrated
# minimum instead.
tilt_min_deg = -33.0
tilt_max_deg = 90.0
tilt_min_uncalibrated_deg = -20.0

[camera]
capture_timeout_s = 10.0
liveview_max_fps = 10.0

[server]
host = "0.0.0.0"
port = 8000

# Where settings and stack records are kept.
# data_dir = "/home/pi/.local/share/macrorail"
