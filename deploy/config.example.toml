# MacroRail installation config. Copy to ~/.config/macrorail/config.toml (install.sh does this).
# Everything here is optional: missing values use the defaults shown.
# Day-to-day settings (speeds, currents, step size, ...) are changed in the web UI instead.

[rail]
# Stable path of the Nano's USB serial port: `ls /dev/serial/by-id/`
port = "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
# Microsteps per mm of travel: 200 steps × 16 microsteps ÷ 8 mm lead (Tr8×8 screw).
steps_per_mm = 400
# Soft limits, in mm from the home switch. The rail parks at min_mm after homing.
min_mm = 0.5
travel_mm = 140.0
homing_speed_mm_s = 2.0
homing_probe_speed_mm_s = 0.2
homing_backoff_mm = 1.0
homing_accel_mm_s2 = 10.0

[camera]
capture_timeout_s = 10.0
liveview_max_fps = 10.0

[server]
host = "0.0.0.0"
port = 8000

# Where settings and stack records are kept.
# data_dir = "/home/pi/.local/share/macrorail"
